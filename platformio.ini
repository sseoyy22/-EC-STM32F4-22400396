; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

##################################################################
# Default Setup : DO-NOT CHANGE HERE  
##################################################################
[platformio]
src_dir = .
include_dir = include

# Default environment setting
[env]
platform = ststm32
board = nucleo_f411re
framework = cmsis
debug_tool = stlink
build_flags = -Wl,-u,_printf_float,-u,_scanf_float -std=c11 -O3



##################################################################
# User-Defined Environment   
##################################################################
#
# For example: LAB GPIO
[env:LAB_GPIO]
build_src_filter = +<lab/LAB_GPIO_DIO_LED/LAB_GPIO_DIO_LED.c> +<include/*.c>

# You can add new environments
[env:TU_CreateProject_Example1]
build_src_filter = +<tutorial/TU_CreateProject_VSC/TU_CreateProject_Example1_main.c> +<include/*.c>

# You can add more new environments
[env:TU_CreateProject_Example2]
build_src_filter = +<tutorial/TU_CreateProject_VSC/TU_CreateProject_Example2_main.c> +<include/*.c>

# TUTORIAL GPIO Out LED
[env:TU_GPIO_Digital_Out_LED]
build_src_filter = +<tutorial/TU_GPIO_Digital/TU_GPIO_Digital_Out_LED_22400396.c> +<include/*.c>

# TUTORIAL GPIO InOut Button
[env:TU_GPIO_Digital_InOut_Button]
build_src_filter = +<tutorial/TU_GPIO_Digital/TU_GPIO_Digital_InOut_Button_22400396.c> +<include/*.c> 

# LAB GPIO DIO LED Photosensor
[env:LAB_GPIO_DIO_LED_Photosensor]
build_src_filter = +<lab/LAB_GPIO_DIO_LED_Photosensor/LAB_GPIO_DIO_LED_Photosensor_22400396.c> +<include/*.c> 

# LAB GPIO DIO multi LED
[env:LAB_GPIO_DIO_multiLED]
build_src_filter = +<lab/LAB_GPIO_DIO_multiLED/LAB_GPIO_DIO_multiLED_22400396.c> +<include/*.c> 

# TUTORIAL 7-Segment Display
[env:TU_GPIO_7segment]
build_src_filter = +<tutorial/TU_GPIO_7segment_22400396.c> +<include/*.c> 

# LAB GPIO 7-Segment (eval board)
[env:LAB_GPIO_7segment]
build_src_filter = +<lab/LAB_GPIO_7segment/LAB_GPIO_7segment_22400396.c> +<include/*.c> 

# TUTORIAL SysTick 
[env:TU_SysTick]
build_src_filter = +<tutorial/TU_SysTick_22400396.c> +<include/*.c> 

# TUTORIAL(PreLAB) EXTI Interrupt 
[env:TU_EXTI]
build_src_filter = +<tutorial/TU_EXTI_22400396.c> +<include/*.c> 

# LAB EXTI & SysTick(eval board)
[env:LAB_EXTI]
build_src_filter = +<lab/LAB_EXTI/LAB_EXTI.c> +<include/*.c> 